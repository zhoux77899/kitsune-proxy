name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.x"

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: ${GITHUB_REF_NAME}"
            exit 1
          fi
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            printf '%s\n' "${unformatted}"
            exit 1
          fi
      - name: Check module files
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check generated icons
        shell: bash
        run: |
          go run ./cmd/icon-gen
          git diff --exit-code -- assets/generated cmd/kitsune-proxy/rsrc_windows_amd64.syso
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...

  package-windows:
    name: Package Windows amd64
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go test ./...
      - name: Build Windows assets
        shell: pwsh
        run: ./packaging/windows/package.ps1 -OutputDirectory dist/release
      - name: Upload Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-amd64
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  package-linux:
    name: Package Linux amd64
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go test ./...
      - name: Build Linux assets
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          bash packaging/linux/package.sh "${version}" dist/release
      - name: Inspect Linux assets
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes rpm

          mkdir -p dist/verify/tar dist/verify/deb
          tar -xzf dist/release/kitsune-proxy-linux-amd64.tar.gz -C dist/verify/tar
          test -x dist/verify/tar/kitsune-proxy
          test "$(dpkg-deb --field dist/release/kitsune-proxy-linux-amd64.deb Architecture)" = "amd64"
          dpkg-deb --extract dist/release/kitsune-proxy-linux-amd64.deb dist/verify/deb
          test -x dist/verify/deb/usr/bin/kitsune-proxy
          test -f dist/verify/deb/usr/share/applications/kitsune-proxy.desktop
          test -f dist/verify/deb/usr/share/icons/hicolor/256x256/apps/kitsune-proxy.png
          test "$(rpm --query --package --queryformat '%{ARCH}' dist/release/kitsune-proxy-linux-amd64.rpm)" = "x86_64"
          rpm --query --package --list dist/release/kitsune-proxy-linux-amd64.rpm > dist/verify/rpm-files.txt
          grep --fixed-strings --line-regexp '/usr/bin/kitsune-proxy' dist/verify/rpm-files.txt
          grep --fixed-strings --line-regexp '/usr/share/applications/kitsune-proxy.desktop' dist/verify/rpm-files.txt
          grep --fixed-strings --line-regexp '/usr/share/icons/hicolor/256x256/apps/kitsune-proxy.png' dist/verify/rpm-files.txt
      - name: Upload Linux assets
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-amd64
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  package-macos:
    name: Package macOS ${{ matrix.arch }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: amd64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go test ./...
      - name: Build macOS assets
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          bash packaging/macos/package.sh "${version}" "${{ matrix.arch }}" dist/release
      - name: Inspect macOS assets
        shell: bash
        run: |
          set -euo pipefail
          verify_directory="$(mktemp -d)"
          device=""
          cleanup() {
            if [[ -n "${device}" ]]; then
              hdiutil detach -quiet "${device}" || true
            fi
            rm -rf "${verify_directory}"
          }
          trap cleanup EXIT

          ditto -x -k "dist/release/kitsune-proxy-macos-${{ matrix.arch }}.zip" "${verify_directory}/zip"
          zip_bundle="${verify_directory}/zip/Kitsune Proxy.app"
          test -x "${zip_bundle}/Contents/MacOS/kitsune-proxy"
          plutil -lint "${zip_bundle}/Contents/Info.plist"

          mkdir -p "${verify_directory}/dmg"
          device="$(hdiutil attach \
            -readonly \
            -nobrowse \
            -mountpoint "${verify_directory}/dmg" \
            "dist/release/kitsune-proxy-macos-${{ matrix.arch }}.dmg" |
            awk '/^\/dev\// { print $1; exit }')"
          dmg_bundle="${verify_directory}/dmg/Kitsune Proxy.app"
          test -x "${dmg_bundle}/Contents/MacOS/kitsune-proxy"
          test "$(readlink "${verify_directory}/dmg/Applications")" = "/Applications"
          plutil -lint "${dmg_bundle}/Contents/Info.plist"

          expected_architecture="${{ matrix.arch }}"
          if [[ "${expected_architecture}" == "amd64" ]]; then
            expected_architecture="x86_64"
          fi
          file "${dmg_bundle}/Contents/MacOS/kitsune-proxy" | grep -q "${expected_architecture}"
          hdiutil detach -quiet "${device}"
          device=""
      - name: Upload macOS assets
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs:
      - package-windows
      - package-linux
      - package-macos
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Download packaged assets
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate checksums and latest manifest
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          published_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"

          go run ./cmd/release-meta \
            -assets-dir release-assets \
            -base-url "${base_url}" \
            -version "${version}" \
            -published-at "${published_at}"
          (
            cd release-assets
            sha256sum --check SHA256SUMS
          )
      - name: Inspect release assets
        shell: bash
        run: |
          find release-assets -maxdepth 1 -type f -printf "%f\n" | sort
      - name: Create release and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_flags=(--verify-tag --generate-notes --title "Kitsune Proxy ${GITHUB_REF_NAME}")
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi

          gh release create \
            "${GITHUB_REF_NAME}" \
            release-assets/* \
            "${release_flags[@]}"
