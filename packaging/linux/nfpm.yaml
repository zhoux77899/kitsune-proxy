name: kitsune-proxy
arch: amd64
platform: linux
version: ${PACKAGE_VERSION}
version_schema: semver
release: "1"
section: net
priority: optional
maintainer: Ruri <akizuki.ruri@gmail.com>
description: |
  A loopback-only system tray proxy that routes AI model requests to
  configured upstreams without translating request or response schemas.
vendor: Kitsune Proxy
homepage: https://github.com/zhoux77899/kitsune-proxy
license: MIT

overrides:
  deb:
    depends:
      - libc6
      - xdg-utils
  rpm:
    depends:
      - glibc
      - xdg-utils

contents:
  - src: ${PACKAGE_BINARY}
    dst: /usr/bin/kitsune-proxy
    expand: true
    file_info:
      mode: 0755
  - src: packaging/linux/kitsune-proxy.desktop
    dst: /usr/share/applications/kitsune-proxy.desktop
    file_info:
      mode: 0644
  - src: assets/generated/kitsune.png
    dst: /usr/share/icons/hicolor/256x256/apps/kitsune-proxy.png
    file_info:
      mode: 0644
  - src: README.md
    dst: /usr/share/doc/kitsune-proxy/README.md
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/doc/kitsune-proxy/LICENSE
    file_info:
      mode: 0644
