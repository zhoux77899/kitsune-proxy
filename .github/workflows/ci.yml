name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.x"

jobs:
  verify:
    name: Verify on Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            printf '%s\n' "${unformatted}"
            exit 1
          fi
      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check generated icons
        run: |
          go run ./cmd/icon-gen
          git diff --exit-code -- assets/generated
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...

  package-windows:
    name: Package Windows amd64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go test ./...
      - name: Build ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/package | Out-Null
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o dist/package/kitsune-proxy.exe ./cmd/kitsune-proxy
          Copy-Item README.md, LICENSE -Destination dist/package
          Compress-Archive -Path dist/package/* -DestinationPath dist/kitsune-proxy-windows-amd64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: kitsune-proxy-windows-amd64
          path: dist/kitsune-proxy-windows-amd64.zip
          if-no-files-found: error

  package-linux:
    name: Package Linux amd64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go test ./...
      - name: Build tarball
        shell: bash
        run: |
          mkdir -p dist/package
          go build -trimpath -ldflags "-s -w" -o dist/package/kitsune-proxy ./cmd/kitsune-proxy
          cp README.md LICENSE dist/package/
          tar -C dist/package -czf dist/kitsune-proxy-linux-amd64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: kitsune-proxy-linux-amd64
          path: dist/kitsune-proxy-linux-amd64.tar.gz
          if-no-files-found: error

  package-macos:
    name: Package macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: amd64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go test ./...
      - name: Build app bundle
        shell: bash
        run: |
          bundle="dist/Kitsune Proxy.app"
          mkdir -p "${bundle}/Contents/MacOS" "${bundle}/Contents/Resources"
          go build -trimpath -ldflags "-s -w" -o "${bundle}/Contents/MacOS/kitsune-proxy" ./cmd/kitsune-proxy
          cp packaging/macos/Info.plist "${bundle}/Contents/Info.plist"
          cp assets/generated/kitsune.icns "${bundle}/Contents/Resources/kitsune.icns"
          chmod 755 "${bundle}/Contents/MacOS/kitsune-proxy"
          ditto -c -k --sequesterRsrc --keepParent "${bundle}" "dist/kitsune-proxy-macos-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: kitsune-proxy-macos-${{ matrix.arch }}
          path: dist/kitsune-proxy-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
