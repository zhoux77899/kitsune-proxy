name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.x"

jobs:
  verify:
    name: Verify on Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            printf '%s\n' "${unformatted}"
            exit 1
          fi
      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check generated icons
        run: |
          go run ./cmd/icon-gen
          git diff --exit-code -- assets/generated cmd/kitsune-proxy/rsrc_windows_amd64.syso
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...

  package-windows:
    name: Package Windows amd64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go test ./...
      - name: Build Windows assets
        shell: pwsh
        run: ./packaging/windows/package.ps1 -OutputDirectory dist
      - uses: actions/upload-artifact@v4
        with:
          name: kitsune-proxy-windows-amd64
          path: dist/kitsune-proxy-windows-amd64.*
          if-no-files-found: error

  package-linux:
    name: Package Linux amd64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go test ./...
      - name: Build Linux assets
        shell: bash
        run: bash packaging/linux/package.sh 0.0.0 dist
      - name: Inspect Linux assets
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes rpm

          mkdir -p dist/verify/tar dist/verify/deb
          tar -xzf dist/kitsune-proxy-linux-amd64.tar.gz -C dist/verify/tar
          test -x dist/verify/tar/kitsune-proxy
          test "$(dpkg-deb --field dist/kitsune-proxy-linux-amd64.deb Architecture)" = "amd64"
          dpkg-deb --extract dist/kitsune-proxy-linux-amd64.deb dist/verify/deb
          test -x dist/verify/deb/usr/bin/kitsune-proxy
          test -f dist/verify/deb/usr/share/applications/kitsune-proxy.desktop
          test -f dist/verify/deb/usr/share/icons/hicolor/256x256/apps/kitsune-proxy.png
          test "$(rpm --query --package --queryformat '%{ARCH}' dist/kitsune-proxy-linux-amd64.rpm)" = "x86_64"
          rpm --query --package --list dist/kitsune-proxy-linux-amd64.rpm > dist/verify/rpm-files.txt
          grep --fixed-strings --line-regexp '/usr/bin/kitsune-proxy' dist/verify/rpm-files.txt
          grep --fixed-strings --line-regexp '/usr/share/applications/kitsune-proxy.desktop' dist/verify/rpm-files.txt
          grep --fixed-strings --line-regexp '/usr/share/icons/hicolor/256x256/apps/kitsune-proxy.png' dist/verify/rpm-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kitsune-proxy-linux-amd64
          path: |
            dist/kitsune-proxy-linux-amd64.tar.gz
            dist/kitsune-proxy-linux-amd64.deb
            dist/kitsune-proxy-linux-amd64.rpm
          if-no-files-found: error

  package-macos:
    name: Package macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: amd64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go test ./...
      - name: Build macOS assets
        shell: bash
        run: bash packaging/macos/package.sh 0.0.0 "${{ matrix.arch }}" dist
      - name: Inspect macOS assets
        shell: bash
        run: |
          set -euo pipefail
          verify_directory="$(mktemp -d)"
          device=""
          cleanup() {
            if [[ -n "${device}" ]]; then
              hdiutil detach -quiet "${device}" || true
            fi
            rm -rf "${verify_directory}"
          }
          trap cleanup EXIT

          ditto -x -k "dist/kitsune-proxy-macos-${{ matrix.arch }}.zip" "${verify_directory}/zip"
          zip_bundle="${verify_directory}/zip/Kitsune Proxy.app"
          test -x "${zip_bundle}/Contents/MacOS/kitsune-proxy"
          plutil -lint "${zip_bundle}/Contents/Info.plist"

          mkdir -p "${verify_directory}/dmg"
          device="$(hdiutil attach \
            -readonly \
            -nobrowse \
            -mountpoint "${verify_directory}/dmg" \
            "dist/kitsune-proxy-macos-${{ matrix.arch }}.dmg" |
            awk '/^\/dev\// { print $1; exit }')"
          dmg_bundle="${verify_directory}/dmg/Kitsune Proxy.app"
          test -x "${dmg_bundle}/Contents/MacOS/kitsune-proxy"
          test "$(readlink "${verify_directory}/dmg/Applications")" = "/Applications"
          plutil -lint "${dmg_bundle}/Contents/Info.plist"

          expected_architecture="${{ matrix.arch }}"
          if [[ "${expected_architecture}" == "amd64" ]]; then
            expected_architecture="x86_64"
          fi
          file "${dmg_bundle}/Contents/MacOS/kitsune-proxy" | grep -q "${expected_architecture}"
          hdiutil detach -quiet "${device}"
          device=""
      - uses: actions/upload-artifact@v4
        with:
          name: kitsune-proxy-macos-${{ matrix.arch }}
          path: |
            dist/kitsune-proxy-macos-${{ matrix.arch }}.zip
            dist/kitsune-proxy-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
